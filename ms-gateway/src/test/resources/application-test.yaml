spring:
  application:
    name: ms-gateway

logging:
  level:
    root: INFO
    org.springframework.boot.test: WARN
    io.github.resilience4j: ERROR
  pattern:
    console: "%d{HH:mm:ss} %-5level %msg%n"

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
